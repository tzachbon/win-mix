<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef3fa">
    <meta name="description" content="Game, chat, and music volume controls for Windows and SteelSeries Sonar.">
    <title>Win Mix — Your sound. Simplified.</title>
    <link rel="icon" href="./app-icon.png" type="image/png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img src="./app-icon.png" width="48" height="48" alt="">
        <span>Win Mix</span>
      </div>
      <a class="github-link" href="https://github.com/tzachbon/win-mix" aria-label="Win Mix on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387.6.11.82-.26.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.09-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.42-1.305.763-1.605-2.665-.305-5.467-1.333-5.467-5.932 0-1.31.468-2.38 1.236-3.22-.124-.304-.536-1.527.117-3.18 0 0 1.008-.322 3.3 1.23.96-.267 1.986-.4 3.006-.405 1.02.005 2.046.138 3.006.405 2.29-1.552 3.296-1.23 3.296-1.23.655 1.653.243 2.876.12 3.18.77.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.624-5.48 5.922.432.372.816 1.102.816 2.22 0 1.603-.014 2.896-.014 3.29 0 .32.216.694.824.576C20.565 22.092 24 17.597 24 12.297c0-6.627-5.373-12-12-12Z" />
        </svg>
      </a>
    </header>

    <main class="page-content">
      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title">Your sound. Simplified.</h1>
        <p class="subtitle">Game, chat, and music. Right where you need them.</p>
        <a class="download-button" id="download" href="https://github.com/tzachbon/win-mix/releases/latest">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14" />
          </svg>
          <span id="download-label">Install for Windows</span>
        </a>
        <p class="compatibility"><span>Windows 10 (2004)+ · x64</span><span>For SteelSeries Sonar</span></p>
      </section>

      <figure class="mixer-figure">
        <div class="mixer" role="img" aria-label="Mixer interface illustration: Main 80 percent; Game 65 percent and selected; Chat 90 percent; Media 45 percent.">
          <div class="channel">
            <div class="channel-heading">
              <svg class="channel-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 10v4h4l5 4V6l-5 4H4Z" />
                <path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11" />
              </svg>
              <span>Main</span>
            </div>
            <div class="channel-meter">
              <span class="meter-track"><span class="meter-fill" style="--level: 80%"></span></span>
              <span class="meter-value">80</span>
            </div>
          </div>

          <div class="channel channel--selected">
            <div class="channel-heading">
              <svg class="channel-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.8 7h10.4a3 3 0 0 1 2.95 2.45l1.1 6A2.1 2.1 0 0 1 19.2 18H17l-2.1-2.5H9.1L7 18H4.8a2.1 2.1 0 0 1-2.06-2.55l1.1-6A3 3 0 0 1 6.8 7Z" />
                <path d="M7.5 10v4m-2-2h4m8-1h.01M17 13h.01" />
              </svg>
              <span>Game</span>
            </div>
            <div class="channel-meter">
              <span class="meter-track"><span class="meter-fill" style="--level: 65%"></span></span>
              <span class="meter-value">65</span>
            </div>
          </div>

          <div class="channel">
            <div class="channel-heading">
              <svg class="channel-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="3" width="6" height="12" rx="3" />
                <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3m-3 0h6" />
              </svg>
              <span>Chat</span>
            </div>
            <div class="channel-meter">
              <span class="meter-track"><span class="meter-fill" style="--level: 90%"></span></span>
              <span class="meter-value">90</span>
            </div>
          </div>

          <div class="channel">
            <div class="channel-heading">
              <svg class="channel-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 18V5l12-2v13M9 8l12-2" />
                <ellipse cx="6" cy="18" rx="3" ry="3" />
                <ellipse cx="18" cy="16" rx="3" ry="3" />
              </svg>
              <span>Media</span>
            </div>
            <div class="channel-meter">
              <span class="meter-track"><span class="meter-fill" style="--level: 45%"></span></span>
              <span class="meter-value">45</span>
            </div>
          </div>
        </div>
        <figcaption>Interface illustration</figcaption>
      </figure>

      <p class="shortcut">
        <kbd>Left Ctrl</kbd>
        <span class="shortcut-plus" aria-hidden="true">+</span>
        <kbd>Left Alt</kbd>
        <span class="shortcut-instruction">Hold. Adjust. Release.</span>
      </p>
    </main>

    <script type="module" src="./download.mjs"></script>
  </body>
</html>
