name: Landing page

on:
  push:
    branches: [main]
    paths: ['site/**', 'Tests/site.test.mjs', 'Assets/app-icon.png', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'Tests/site.test.mjs', 'Assets/app-icon.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test Tests/site.test.mjs
      - name: Stage website only
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp site/index.html site/styles.css site/download.mjs "$RUNNER_TEMP/site/"
          cp Assets/app-icon.png "$RUNNER_TEMP/site/app-icon.png"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
