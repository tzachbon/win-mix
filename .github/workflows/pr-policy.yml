name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await require('./.github/scripts/release-policy.cjs').validatePullRequestTitle({context});
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
          RELEASE_BOT_USER_ID: ${{ vars.RELEASE_BOT_USER_ID }}
          RELEASE_BOT_APP_ID: ${{ vars.RELEASE_BOT_APP_ID }}
          RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
        with:
          script: |
            await require('./.github/scripts/release-policy.cjs').validateReleaseMetadataCheck({github, context});
