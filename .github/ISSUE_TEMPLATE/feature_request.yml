name: Feature request
description: Describe a problem and the outcome that would help.
body:
  - type: markdown
    attributes:
      value: Suggest an outcome that would help you; a request does not imply a commitment to implement it.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: What outcome would you like?
      description: Describe the result that would help. A specific implementation is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or context (optional)
      description: Mention workarounds or related context if useful.
